name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: https://meigoku-web.pages.dev
      PUBLIC_SITE_INDEXABLE: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Astro project
        run: npm run check

      - name: Verify public site configuration
        run: npm run test:public-site-config

      - name: Verify soul-reading rules
        run: npm run test:soul-reading

      - name: Verify shareable soul results
        run: npm run test:soul-sharing

      - name: Verify published join schedule
        run: npm run test:join

      - name: Build static site
        run: npm run build
